# Disable the built-in HTTP server — this is a pure CLI/daemon app
quarkus.http.port=-1

# Logging
quarkus.log.level=WARN
quarkus.log.category."com.example".level=INFO
# Suppress noisy Milo/Netty startup logs at INFO; set DEBUG to see details
quarkus.log.category."org.eclipse.milo".level=WARN
quarkus.log.category."io.netty".level=WARN
